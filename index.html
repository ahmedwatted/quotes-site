<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رسالة اليوم</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="images/icon.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

* {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  scroll-behavior: smooth;
}

/* مودال التعليقات */
#commentsContent {
  background: #121212;
  border-top: 2px solid var(--main-gold);
}

#commentsList {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 10px;
  max-height: 400px;
}

.comment-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: rgba(255,255,255,0.06);
  padding: 12px;
  border-radius: 15px;
  transition: 0.2s;
}

.comment-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  flex-shrink: 0;
}

.comment-content {
  flex: 1;
}

.comment-name { 
  color: var(--main-gold);
  font-weight: bold;
}

.comment-text {
  font-size: 14px;
  margin-top: 3px;
  line-height: 1.4;
  word-break: break-word;
}

.comment-like {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  font-size: 13px;
  color: #aaa;
  flex-shrink: 0;
}

.comment-like i {
  font-size: 18px;
}

.comment-like.liked {
  color: #D6C5AE;
}

.comment-input-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

/* ========================================
   متغيرات الألوان والتصميم
   ======================================== */
:root {
  --main-gold: #D6C5AE;
  --main-gold-dark: #b8a68e;
  --main-gold-trans: rgba(214, 197, 174, 0.15);
  --bg-black: #000000;
  --text-white: #ffffff;
  --app-color: #D6C5AE;
  --app-color-transparent: rgba(214, 197, 174, 0.15);
}

body { 
  margin: 0; 
  font-family: 'Cairo', sans-serif;
  background: var(--bg-black);
  color: white; 
  overflow: hidden;
}

#bg { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background-size: cover; 
  background-position: center; 
  filter: blur(25px) brightness(0.5); 
  transform: scale(1.2); 
  transition: background-image 0.5s ease-in-out; 
  z-index: -1; 
}

/* شاشة البداية */
.overlay { 
  position: fixed; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.7); 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  z-index: 50; 
  gap: 20px; 
}

.start-icon { 
  width: 100px; 
  height: 100px; 
  border-radius: 20px; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
}

.start-btn { 
  padding: 18px 40px; 
  font-size: 18px; 
  font-family: 'Cairo', sans-serif; 
  border-radius: 20px; 
  border: none; 
  backdrop-filter: blur(10px); 
  background: rgba(255,255,255,0.15); 
  color: white; 
  cursor: pointer; 
  transition: 0.3s; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
}

.start-btn:active {
  transform: scale(0.95);
}

#splashScreen { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: black; 
  display: none; 
  justify-content: center; 
  align-items: center; 
  z-index: 55; 
  opacity: 0; 
  transition: opacity 0.5s ease; 
}

#splashScreen img { 
  width: 150px; 
  height: 150px; 
  border-radius: 30px; 
  animation: pulseIcon 1.5s infinite; 
}

@keyframes pulseIcon { 
  0% { transform: scale(1); opacity: 0.8; } 
  50% { transform: scale(1.05); opacity: 1; } 
  100% { transform: scale(1); opacity: 0.8; } 
}

/* الحاوية الرئيسية */
#mainApp { 
  display: none;
  min-height: 100dvh; 
  position: relative; 
  z-index: 5;
  width: 100%;
  height: 100vh;
}

.header-container { 
  display: none;
}

/* تنسيقات التيك توك */
#todayTab { 
  padding: 0; 
  margin: 0; 
  height: 100dvh;
  width: 100%;
}

.feed-container { 
  height: 100vh; 
  width: 100vw; 
  overflow-y: scroll; 
  scroll-snap-type: y mandatory; 
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; 
  position: relative;
  contain: layout style paint;
}

.feed-container::-webkit-scrollbar { 
  display: none; 
}

.post {
  height: 100vh;
  width: 100%;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  scroll-snap-align: start;
  background: #000;
  flex-shrink: 0;
}

.post-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  display: block;
}

/* الأزرار الجانبية */
.feed-side-actions {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

.feed-action-wrapper { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 8px; 
}

.feed-action-btn { 
  background: rgba(0, 0, 0, 0.5); 
  border: 2px solid var(--main-gold);
  backdrop-filter: blur(8px);
  color: white; 
  font-size: 20px; 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  border-radius: 50%; 
  width: 48px; 
  height: 48px; 
  transition: all 0.2s ease-out;
  position: relative;
  will-change: transform;
}

.feed-action-btn:active { 
  transform: scale(0.85); 
}

.feed-action-label { 
  font-size: 11px;
  font-weight: bold;
  color: var(--main-gold);
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  min-width: 30px;
  text-align: center;
}

@keyframes pulseHeart { 
  0% { transform: scale(1); } 
  50% { transform: scale(1.1); } 
  100% { transform: scale(1); } 
}

.feed-action-btn.liked {
  background: var(--main-gold);
  color: var(--bg-black);
}

.feed-action-btn.liked .icon-filled { 
  animation: pulseHeart 0.3s ease; 
}

.icon-outlined, .icon-filled { 
  position: absolute; 
  transition: opacity 0.3s, color 0.3s; 
}

.feed-action-btn i {
  color: inherit;
}

.icon-filled { 
  opacity: 0; 
}

.feed-action-btn.liked .icon-outlined { 
  opacity: 0; 
}

.feed-action-btn.liked .icon-filled { 
  opacity: 1; 
}

.heart-animation { 
  position: fixed; 
  font-size: 100px; 
  color: var(--app-color); 
  z-index: 10; 
  opacity: 0; 
  pointer-events: none; 
  transform: scale(0.5); 
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}

.heart-animation.show { 
  opacity: 1; 
  transform: scale(1) translateY(-30px) rotate(-15deg); 
}

/* نافذة المشاركة */
.bottom-sheet-content { 
  position: absolute; 
  bottom: 0; 
  width: 100%; 
  border-radius: 20px 20px 0 0; 
  margin: 0; 
  padding-bottom: 40px; 
  border: none; 
  border-top: 1px solid #333; 
  animation: slideUp 0.3s ease-out; 
}

@keyframes slideUp { 
  from { transform: translateY(100%); } 
  to { transform: translateY(0); } 
}

.share-grid { 
  display: flex; 
  justify-content: space-around; 
  margin-top: 25px; 
}

.share-item { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 10px; 
  cursor: pointer; 
  transition: transform 0.2s; 
}

.share-item:active { 
  transform: scale(0.9); 
}

.share-icon { 
  width: 55px; 
  height: 55px; 
  background: #2a2a2a; 
  border-radius: 50%; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 24px; 
  color: white; 
}

.share-item span { 
  font-size: 13px; 
  font-family: 'Cairo', sans-serif; 
}

/* النوافذ والإشعارات */
.modal-overlay { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.8); 
  display: none; 
  justify-content: center; 
  align-items: center; 
  z-index: 200; 
  backdrop-filter: blur(8px); 
}

.modal-content { 
  background: rgba(20,20,20,0.95); 
  backdrop-filter: blur(20px); 
  border: 1px solid rgba(255,255,255,0.2); 
  border-radius: 25px; 
  padding: 20px; 
  width: 90%; 
  max-width: 350px; 
  text-align: center; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
  transform: scale(0.8); 
  opacity: 0; 
  transition: 0.4s; 
  position: relative; 
  box-sizing: border-box; 
}

.modal-content.show-modal { 
  transform: scale(1); 
  opacity: 1; 
}

.close-modal { 
  position: absolute; 
  top: 15px; 
  right: 15px; 
  background: none; 
  border: none; 
  color: white; 
  font-size: 20px; 
  cursor: pointer; 
  z-index: 10; 
}

.submit-btn {
  background: var(--main-gold) !important;
  color: #000 !important;
  font-weight: bold;
  padding: 12px 20px !important;
  border-radius: 10px !important;
  border: none !important;
  cursor: pointer;
  transition: 0.3s;
  width: 100%;
}

.submit-btn:active {
  transform: scale(0.95);
}

#toast-container { 
  position: fixed; 
  bottom: 20px; 
  left: 50%; 
  transform: translateX(-50%); 
  z-index: 1000; 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
  width: 90%; 
  max-width: 300px;
}

.toast { 
  background: rgba(255,255,255,0.95); 
  color: black; 
  padding: 12px 20px; 
  border-radius: 20px; 
  font-family: 'Cairo', sans-serif; 
  font-weight: bold; 
  font-size: 14px; 
  box-shadow: 0 5px 20px rgba(0,0,0,0.4); 
  opacity: 0; 
  transform: translateY(20px); 
  transition: all 0.4s ease; 
  text-align: center; 
}

.toast.show { 
  opacity: 1; 
  transform: translateY(0); 
}

/* تنسيقات Desktop - بدون Sidebar */
@media (min-width: 768px) {
  .feed-container {
    width: 100%;
    height: 100vh;
    display: flex;
  }

  .post {
    width: 100%;
    height: 100vh;
  }

  .feed-side-actions {
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
  }

  .post-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
}
</style>
</head>
<body>

<div id="bg"></div>

<div id="splashScreen">
  <img src="images/icon.png" alt="رسالة">
</div>

<div class="overlay" id="overlay">
  <img src="images/icon.png" alt="رسالة" class="start-icon">
  <button class="start-btn" onclick="showSplashScreen()">اضغط لتبدأ</button>
</div>

<div id="mainApp">
  <div id="todayTab" class="tab-content active-tab">
    <div class="feed-container" id="feed"></div>
  </div>
</div>

<div class="modal-overlay" id="shareSheetModal" onclick="if(event.target===this) closeModalSheet('shareSheetModal')">
  <div class="modal-content bottom-sheet-content" id="shareSheetContent" style="transform: translateY(0); opacity: 1;">
    <h3 style="margin-top: 0; font-family: 'Cairo', sans-serif;">مشاركة عبر</h3>
    <div class="share-grid">
      <div class="share-item" onclick="downloadFromSrc(currentShareImgSrc); closeModalSheet('shareSheetModal');">
        <div class="share-icon" style="background: var(--app-color); color: #1a1a1a;"><i class="far fa-arrow-alt-circle-down"></i></div>
        <span>حفظ الصورة</span>
      </div>
      <div class="share-item" onclick="shareFromSrc(currentShareImgSrc); closeModalSheet('shareSheetModal');">
        <div class="share-icon"><i class="far fa-paper-plane"></i></div>
        <span>مشاركة</span>
      </div>
      <div class="share-item" onclick="alert('جاري الفتح في واتساب...'); closeModalSheet('shareSheetModal');">
        <div class="share-icon" style="background: #25D366;"><i class="fab fa-whatsapp"></i></div>
        <span>واتساب</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="commentsModal" onclick="if(event.target===this) closeModal('commentsModal','commentsContent')">
  <div class="modal-content" id="commentsContent">
    <button class="close-modal" onclick="closeModal('commentsModal','commentsContent')">✖</button>
    
    <h3>التعليقات 💬</h3>
    <div id="commentsList"></div>

    <div class="comment-input-row">
      <input id="commentInput" class="custom-input" placeholder="اكتب تعليقك...">
      <button class="submit-btn" onclick="addComment()">إرسال</button>
    </div>
  </div>
</div>

<script>
// المتغيرات الأساسية
const images = [
"images/1.jpg", "images/2.jpg", "images/3.jpg", "images/4.jpg",
"images/5.jpg", "images/6.jpg", "images/7.jpg", "images/8.jpg",
"images/9.jpg", "images/10.jpg", "images/11.jpg", "images/12.jpg",
"images/13.jpg", "images/14.jpg", "images/15.jpg", "images/16.jpg",
"images/17.jpg", "images/18.jpg", "images/19.jpg", "images/20.jpg",
"images/21.jpg", "images/22.jpg", "images/23.jpg", "images/24.jpg",
"images/25.jpg", "images/26.jpg", "images/27.jpg", "images/28.jpg",
"images/29.jpg", "images/30.jpg", "images/31.jpg", "images/32.jpg",
"images/33.jpg", "images/34.jpg", "images/35.jpg", "images/36.jpg",
"images/37.jpg", "images/38.jpg", "images/39.jpg", "images/40.jpg",
"images/41.jpg", "images/42.jpg", "images/43.jpg", "images/44.jpg"
];

let currentFavOpenIndex = null; 
let currentShareImgSrc = "";
let currentPost = null;
let renderedIndices = new Set();

// إشعار التوست
function showToast(message) {
  let container = document.getElementById("toast-container");
  
  if (!container) { 
    container = document.createElement("div"); 
    container.id = "toast-container"; 
    document.body.appendChild(container); 
  }
  
  const toast = document.createElement("div"); 
  toast.className = "toast"; 
  toast.innerText = message; 
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add("show");
  }, 10);
  
  setTimeout(() => { 
    toast.classList.remove("show"); 
    setTimeout(() => {
      toast.remove();
    }, 400); 
  }, 3000);
}

// نظام التشغيل والشعلة
function initApp() {
  const today = new Date().toDateString();
  let savedDate = localStorage.getItem("appDate");
  
  if (!localStorage.getItem("unseenQuotes")) {
    generateShuffledQuotes();
  }
  
  if (savedDate !== today) {
    localStorage.setItem("appDate", today);
    localStorage.setItem("viewCount", "1");
    localStorage.setItem("currentQuoteIndex", getNextQuoteIndex().toString());
  }
}

function generateShuffledQuotes() {
  let all = Array.from({length: images.length}, (_, i) => i);
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  localStorage.setItem("unseenQuotes", JSON.stringify(all));
}

function getNextQuoteIndex() {
  let unseen = JSON.parse(localStorage.getItem("unseenQuotes")) || [];
  
  if (unseen.length === 0) {
    generateShuffledQuotes();
    unseen = JSON.parse(localStorage.getItem("unseenQuotes"));
  }
  
  let nextIndex = unseen.pop();
  localStorage.setItem("unseenQuotes", JSON.stringify(unseen));
  return nextIndex;
}

function showSplashScreen() {
  const overlay = document.getElementById("overlay");
  const splash = document.getElementById("splashScreen");
  
  overlay.style.opacity = "0";
  
  setTimeout(() => {
    overlay.style.display = "none"; 
    splash.style.display = "flex"; 
    initApp(); 
    setTimeout(() => {
      splash.style.opacity = "1";
    }, 50);
  }, 500);
  
  setTimeout(() => {
    splash.style.opacity = "0";
    setTimeout(() => {
      splash.style.display = "none"; 
      document.getElementById("mainApp").style.display = "flex";
      renderFeed(); 
      setupDoubleTap();
    }, 500);
  }, 2000);
}

// نظام التيك توك - محسّن للأداء
function renderFeed() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  images.forEach((src, index) => {
    const post = document.createElement("div");
    post.className = "post";
    post.dataset.index = index;

    post.innerHTML = `
      <img src="${src}" class="post-img" loading="lazy" alt="رسالة ${index + 1}">

      <div class="feed-side-actions">
        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="toggleFeedLike(this, ${index})" data-index="${index}">
            <i class="far fa-heart icon-outlined"></i>
            <i class="fas fa-heart icon-filled"></i>
          </button>
          <span class="feed-action-label" id="feed-count-${index}">1.2K</span>
        </div>

        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="openComments(${index})">
            <i class="fas fa-comment"></i>
          </button>
          <span class="feed-action-label">32</span>
        </div>

        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="openShareMenu('${src}')">
            <i class="fas fa-paper-plane"></i>
          </button>
          <span class="feed-action-label">نشر</span>
        </div>
      </div>
    `;
    feed.appendChild(post);
  });

  setupDoubleTap();
  setupLikedImages();
}

function setupLikedImages() {
  let likedImages = JSON.parse(localStorage.getItem("likedImages")) || {};
  
  Object.keys(likedImages).forEach(index => {
    const btn = document.querySelector(`[data-index="${index}"]`);
    if (btn) {
      btn.classList.add('liked');
    }
  });
}

function setupDoubleTap() {
  const posts = document.querySelectorAll('.post');
  posts.forEach(post => {
    let lastClick = 0;
    post.addEventListener('click', function(e) {
      if(e.target.closest('.feed-side-actions')) return;
      
      let currentTime = new Date().getTime();
      let timeDiff = currentTime - lastClick;
      
      if (timeDiff < 300 && timeDiff > 0) {
        const heart = document.createElement('div');
        heart.className = 'heart-animation show';
        heart.innerHTML = '❤️';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 600);
        
        const likeBtn = post.querySelector('.feed-action-wrapper .feed-action-btn'); 
        if (!likeBtn.classList.contains('liked')) {
          likeBtn.click();
        }
      }
      lastClick = currentTime;
    });
  });
}

function toggleFeedLike(btn, imgIndex) {
  let likedImages = JSON.parse(localStorage.getItem("likedImages")) || {}; 
  let countSpan = document.getElementById(`feed-count-${imgIndex}`);
  let count = parseFloat(countSpan.innerText);
  
  if (!btn.classList.contains('liked')) {
    btn.classList.add('liked');
    countSpan.innerText = (count + 0.1).toFixed(1) + 'K';
    likedImages[imgIndex] = true;
    showToast("تم الحفظ في المفضلة 🤍");
  } else {
    btn.classList.remove('liked');
    countSpan.innerText = Math.max(0, count - 0.1).toFixed(1) + 'K';
    delete likedImages[imgIndex];
  }
  
  localStorage.setItem("likedImages", JSON.stringify(likedImages)); 
}

function openShareMenu(src) { 
  currentShareImgSrc = src; 
  document.getElementById('shareSheetModal').style.display = "flex"; 
}

function openComments(index) {
  currentPost = index;
  showModal('commentsModal','commentsContent');
  loadComments();
}

// التنقل والنوافذ
function showModal(modalId, contentId) { 
  const modal = document.getElementById(modalId); 
  const content = document.getElementById(contentId); 
  modal.style.display = "flex"; 
  setTimeout(() => { 
    content.classList.add("show-modal"); 
  }, 50); 
}

function closeModal(modalId, contentId) { 
  const modal = document.getElementById(modalId); 
  const content = document.getElementById(contentId); 
  content.classList.remove("show-modal"); 
  setTimeout(() => { 
    modal.style.display = "none"; 
  }, 400); 
}

function closeModalSheet(modalId) { 
  document.getElementById(modalId).style.display = "none"; 
}

function downloadFromSrc(src) { 
  const link = document.createElement('a'); 
  link.href = src; 
  link.download = 'رسالة.jpg'; 
  document.body.appendChild(link); 
  link.click(); 
  document.body.removeChild(link); 
  showToast("بدأ التحميل 📥"); 
}

async function shareFromSrc(src) {
  try {
    const response = await fetch(src); 
    const blob = await response.blob(); 
    const file = new File([blob], 'رسالة.jpg', { type: blob.type });
    
    if (navigator.canShare && navigator.canShare({ files: [file] })) { 
      await navigator.share({ 
        title: 'رسالة اليوم', 
        text: 'حبيت أشاركك هالرسالة اللطيفة ✨', 
        files: [file] 
      }); 
    } else { 
      await navigator.share({ 
        title: 'رسالة اليوم', 
        text: 'شوف موقع رسالة اليوم ✨', 
        url: window.location.href 
      }); 
    }
  } catch (err) { 
    showToast("مشاركة غير مدعومة هنا 😢"); 
  }
}

// التعليقات
function loadComments() {
  const list = document.getElementById("commentsList");
  list.innerHTML = "";

  let comments = JSON.parse(localStorage.getItem("comments_" + currentPost)) || [];

  if (comments.length === 0) {
    list.innerHTML = "<p style='color:#aaa; text-align:center;'>لا يوجد تعليقات</p>";
    return;
  }

  comments.forEach((c, i) => {
    let div = document.createElement("div");
    div.className = "comment-item";

    div.innerHTML = `
      <img class="comment-avatar" src="https://i.pravatar.cc/150?img=${i+5}">
      
      <div class="comment-content">
        <div class="comment-name">مستخدم ${i+1}</div>
        <div class="comment-text">${c.text}</div>
      </div>

      <div class="comment-like ${c.liked ? 'liked' : ''}" onclick="toggleCommentLike(${i})">
        <i class="fas fa-heart"></i>
        <span>${c.likes || 0}</span>
      </div>
    `;

    list.appendChild(div);
  });
}

function addComment() {
  const input = document.getElementById("commentInput");
  let text = input.value.trim();

  if (!text) return;

  let key = "comments_" + currentPost;
  let comments = JSON.parse(localStorage.getItem(key)) || [];

  comments.unshift({
    text: text,
    likes: 0,
    liked: false
  });

  localStorage.setItem(key, JSON.stringify(comments));

  input.value = "";
  loadComments();
  showToast("تم إضافة التعليق 💬");
}

function toggleCommentLike(index) {
  let key = "comments_" + currentPost;
  let comments = JSON.parse(localStorage.getItem(key)) || [];

  let comment = comments[index];

  if (!comment.liked) {
    comment.likes++;
    comment.liked = true;
  } else {
    comment.likes--;
    comment.liked = false;
  }

  localStorage.setItem(key, JSON.stringify(comments));
  loadComments();
}

style.textContent = `
.custom-input {
  width: 100%;
  background: rgba(255,255,255,0.1);

  color: white;
  border-radius: 10px;
  padding: 10px;
  font-family: 'Cairo', sans-serif;
  box-sizing: border-box;
  outline: none;
}

.custom-input::placeholder {
  color: rgba(255,255,255,0.5);
}
`;
document.head.appendChild(style);
