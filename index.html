<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رسالة اليوم</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="images/icon.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cnjs.clouflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* مودال التعليقات يكون مثل تيك توك */
#commentsContent {
  background: #121212;
  border-top: 2px solid var(--main-gold);
}

/* قائمة التعليقات */
#commentsList {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 10px;
}

/* التعليق */
.comment-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: rgba(255,255,255,0.06);
  padding: 12px;
  border-radius: 15px;
  transition: 0.2s;
}

/* صورة المستخدم */
.comment-avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

/* المحتوى */
.comment-content {
  flex: 1;
}

/* الاسم */
.comment-name { color: var(--main-gold); }

/* النص */
.comment-text {
  font-size: 14px;
  margin-top: 3px;
  line-height: 1.4;
}

/* زر اللايك */
.comment-like {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  font-size: 13px;
  color: #aaa;
}

.comment-like i {
  font-size: 18px;
}

.comment-like.liked {
  color: #D6C5AE;
}

/* input تحت */
.comment-input-row {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
   
/* ========================================
   متغيرات الألوان والتصميم
   ======================================== */
:root {
  --main-gold: #D6C5AE;
  --main-gold-dark: #b8a68e;
  --main-gold-trans: rgba(214, 197, 174, 0.15);
  --bg-black: #000000;
  --text-white: #ffffff;
}

body { 
  margin: 0; 
  font-family: 'Cairo', sans-serif;
  background: var(--bg-black);
  color: white; 
  overflow: hidden; /* لمنع السكرول المزدوج */
}
#bg { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background-size: cover; 
  background-position: center; 
  filter: blur(25px) brightness(0.5); 
  transform: scale(1.2); 
  transition: background-image 0.5s ease-in-out; 
  z-index: -1; 
}

/* شاشة البداية */
.overlay { 
  position: fixed; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.7); 
  display: flex; 
  flex-direction: column; 
  justify-content: center; 
  align-items: center; 
  z-index: 50; 
  gap: 20px; 
}

.start-icon { 
  width: 100px; 
  height: 100px; 
  border-radius: 20px; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
}

.start-btn { 
  padding: 18px 40px; 
  font-size: 18px; 
  font-family: 'Tajawal', sans-serif; 
  border-radius: 20px; 
  border: none; 
  backdrop-filter: blur(10px); 
  background: rgba(255,255,255,0.15); 
  color: white; 
  cursor: pointer; 
  transition: 0.3s; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
}

#splashScreen { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: black; 
  display: none; 
  justify-content: center; 
  align-items: center; 
  z-index: 55; 
  opacity: 0; 
  transition: opacity 0.5s ease; 
}

#splashScreen img { 
  width: 150px; 
  height: 150px; 
  border-radius: 30px; 
  animation: pulseIcon 1.5s infinite; 
}

@keyframes pulseIcon { 
  0% { transform: scale(1); opacity: 0.8; } 
  50% { transform: scale(1.05); opacity: 1; } 
  100% { transform: scale(1); opacity: 0.8; } 
}

/* الحاوية الرئيسية وشريط التنقل - تم إصلاح التموضع */
#mainApp { 
  display: none; /* تغيير لضمان عدم تداخل الطول */
  min-height: 100dvh; 
  position: relative; 
  z-index: 5; 
}

.header-container { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  padding: 15px 0 10px 0; 
  background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); 
  position: fixed; /* جعل القائمة تطفو فوق الفيد */
  top: 0; 
  left: 0;
  right: 0;
  z-index: 100; 
  gap: 10px; 
  width: 100%; 
}

.streak-badge { 
  background: var(--app-color-transparent); 
  border: 1px solid var(--app-color); 
  color: var(--app-color); 
  padding: 5px 15px; 
  border-radius: 20px; 
  font-size: 14px; 
  font-weight: bold; 
  display: flex; 
  align-items: center; 
  gap: 5px; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
}

.header { 
  display: flex; 
  justify-content: center; 
  gap: 8px; 
  flex-wrap: nowrap; 
  overflow-x: auto; 
  width: 100%; 
  padding: 5px 10px; 
  box-sizing: border-box; 
  -webkit-overflow-scrolling: touch; 
  scrollbar-width: none; 
}

.header::-webkit-scrollbar { 
  display: none; 
}

.nav-btn { 
  white-space: nowrap; 
  flex-shrink: 0; 
  background: rgba(255,255,255,0.1); 
  border: 1px solid rgba(255,255,255,0.2); 
  color: white; 
  padding: 10px 15px; 
  border-radius: 20px; 
  font-family: 'Tajawal', sans-serif; 
  font-size: 13px; 
  font-weight: bold; 
  cursor: pointer; 
  transition: 0.3s; 
  backdrop-filter: blur(10px); 
}

.nav-btn.active { 
  background: transparent; 
  color: var(--app-color); 
  border: 1px solid var(--app-color); 
  box-shadow: none; 
}

/* الأقسام العامة */
.tab-content { 
  display: none; 
  flex-direction: column; 
  align-items: center; 
  width: 100%; 
  box-sizing: border-box; 
}

.tab-content.active-tab { 
  display: flex; 
}

/* ========================================
   تنسيقات التيك توك العمودي (رسالة اليوم)
   (سريعة وسلسة وملء الشاشة تماماً)
   ======================================== */
#todayTab { 
  padding: 0; 
  margin: 0; 
  height: 100dvh;
}

.feed-container { 
  height: 100vh; 
  width: 100vw; 
  overflow-y: scroll; 
  scroll-snap-type: y mandatory; 
  scroll-behavior: smooth; /* للحفاظ على سلاسة الأداء وإلغاء البطء */
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none; 
  position: relative;
}

.feed-container::-webkit-scrollbar { 
  display: none; 
}

.post {
  height: 100vh;
  width: 100%;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  scroll-snap-align: start;
  background: #000;
}
.post-bg-blur { 
  position: absolute; 
  top: -5%; left: -5%; right: -5%; bottom: -5%;
  background-size: cover; 
  background-position: center; 
  filter: blur(10px) brightness(0.5); 
  z-index: 0; 
  transform: translateZ(0); 
  will-change: transform;
}

.post-img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* يخليها مرتبة */
}

/* الأزرار الجانبية الزجاجية */
.feed-side-actions {
  position: absolute;
  right: 15px; /* وضعها دائماً على اليمين */
  bottom: 100px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-items: center;
}

.feed-action-wrapper { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 6px; 
}

.feed-action-btn { 
  background: rgba(0, 0, 0, 0.5); 
  border: 2px solid var(--main-gold); /* إطار ذهبي */
  backdrop-filter: blur(8px);
  color: white; 
  font-size: 22px; 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  border-radius: 50%; 
  width: 52px; 
  height: 52px; 
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.feed-action-btn:active { 
  transform: scale(0.85); 
}

.feed-action-label { 
  font-size: 12px;
  font-weight: bold;
  color: var(--main-gold); /* الأرقام تحت الأزرار ذهبية */
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

@keyframes pulseHeart { 
  0% { transform: scale(1); } 
  50% { transform: scale(1.1); } 
  100% { transform: scale(1); } 
}
.feed-action-btn.liked {
  background: var(--main-gold);
  color: var(--bg-black);
}
.feed-action-btn.liked .icon-filled { 
  animation: pulseHeart 0.3s ease; 
}

.icon-outlined, .icon-filled { 
  position: absolute; 
  transition: opacity 0.3s, color 0.3s; 
}
.feed-action-btn i {
  color: inherit; /* عشان يتبع لون الزر */
}
.icon-filled { 
  opacity: 0; 
  color: var(--app-color); 
}

.feed-action-btn.liked .icon-outlined { 
  opacity: 0; 
}

.feed-action-btn.liked .icon-filled { 
  opacity: 1; 
}

.heart-animation { 
  position: absolute; 
  font-size: 120px; 
  color: var(--app-color); 
  z-index: 10; 
  opacity: 0; 
  pointer-events: none; 
  transform: scale(0.5); 
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}

.heart-animation.show { 
  opacity: 1; 
  transform: scale(1) translateY(-20px) rotate(-15deg); 
}

/* نافذة المشاركة السفلية */
.bottom-sheet-content { 
  position: absolute; 
  bottom: 0; 
  width: 100%; 
  max-width: 100%; 
  border-radius: 20px 20px 0 0; 
  margin: 0; 
  padding-bottom: 40px; 
  border: none; 
  border-top: 1px solid #333; 
  animation: slideUp 0.3s ease-out; 
}

@keyframes slideUp { 
  from { transform: translateY(100%); } 
  to { transform: translateY(0); } 
}

.share-grid { 
  display: flex; 
  justify-content: space-around; 
  margin-top: 25px; 
}

.share-item { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 10px; 
  cursor: pointer; 
  transition: transform 0.2s; 
}

.share-item:active { 
  transform: scale(0.9); 
}

.share-icon { 
  width: 55px; 
  height: 55px; 
  background: #2a2a2a; 
  border-radius: 50%; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-size: 24px; 
  color: white; 
}

.share-item span { 
  font-size: 13px; 
  font-family: 'Cairo', sans-serif; 
}


/* ========================================
   تنسيقات الأقسام (المفضلات وسوي رسالتك) 
   ======================================== */
#favTab, #createTab {
  padding-top: 110px; /* لضمان عدم اختفائها تحت القائمة العلوية العائمة */
  padding-bottom: 40px;
}

.action-btn { 
  flex: 1; 
  padding: 12px 5px; 
  border-radius: 15px; 
  border: none; 
  font-family: 'Tajawal', sans-serif; 
  font-size: 14px; 
  font-weight: bold; 
  cursor: pointer; 
  transition: 0.3s; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  gap: 5px; 
  white-space: nowrap; 
}

.download-btn { background: rgba(255, 255, 255, 0.9); color: black; }
.share-btn { background: var(--app-color-transparent); color: var(--app-color); border: 1px solid rgba(214, 197, 174, 0.5); }
.like-btn { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
.like-btn.liked { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border-color: rgba(255, 59, 48, 0.5); }

.favorites-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
  gap: 10px; 
  width: 100%; 
  max-width: 500px; 
}

.fav-item { 
  width: 100%; 
  aspect-ratio: 1; 
  object-fit: cover; 
  border-radius: 15px; 
  box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
  border: 2px solid rgba(255,255,255,0.1); 
  transition: 0.3s; 
  cursor: pointer; 
}

.empty-state { 
  text-align: center; 
  color: #ccc; 
  margin-top: 50px; 
  font-size: 16px; 
  grid-column: 1 / -1; 
}

.creator-card { 
  background: rgba(0,0,0,0.5); 
  backdrop-filter: blur(15px); 
  padding: 15px; 
  border-radius: 25px; 
  width: 100%; 
  max-width: 450px; 
  border: 1px solid rgba(255,255,255,0.2); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
  box-sizing: border-box; 
}

.canvas-container { 
  position: relative; 
  width: 100%; 
  border-radius: 15px; 
  overflow: hidden; 
  touch-action: none; 
  background: #000; 
  margin-bottom: 15px; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  transition: aspect-ratio 0.3s ease; 
  aspect-ratio: 9/16; 
} 

.canvas-container > img#templateBg { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  object-position: 50% 50%; 
  display: block; 
  user-select: none; 
  pointer-events: auto; 
  position: absolute; 
  top: 0; 
  left: 0; 
  z-index: 0; 
  cursor: grab; 
}

.draggable-item { 
  position: absolute; 
  transform-origin: center center; 
  cursor: move; 
  user-select: none; 
  z-index: 1; 
  pointer-events: auto; 
  will-change: transform; 
}

.draggable-item.selected { 
  border: 2px dashed var(--app-color); 
  background: rgba(255,255,255,0.2); 
  border-radius: 5px; 
}

.draggable-text { 
  color: #fff; 
  font-size: 24px; 
  font-weight: bold; 
  font-family: 'Amiri', serif;
  text-align: center; 
  white-space: pre-wrap; 
  padding: 5px; 
  text-shadow: 0px 0px 5px rgba(0,0,0,0.8); 
}

.draggable-img { 
  max-width: 150px; 
  display: block; 
}

.buttons-row { 
  display: flex; 
  gap: 8px; 
  margin-bottom: 10px; 
  flex-wrap: wrap;
}

.add-btn { 
  flex: 1; 
  background: var(--app-color-transparent); 
  color: var(--app-color); 
  border: 1px dashed rgba(214, 197, 174, 0.5); 
  padding: 10px; 
  border-radius: 10px; 
  font-family: 'Tajawal'; 
  font-size: 13px; 
  font-weight: bold; 
  cursor: pointer; 
  text-align: center;
}

.tools-panel { 
  background: rgba(255,255,255,0.05); 
  padding: 15px; 
  border-radius: 15px; 
  margin-bottom: 10px; 
  border: 1px solid rgba(255,255,255,0.1); 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
}

.custom-input, .custom-select { 
  width: 100%; 
  background: rgba(255,255,255,0.1); 
  border: 1px solid rgba(255,255,255,0.3); 
  color: white; 
  border-radius: 10px; 
  padding: 10px; 
  font-family: inherit; 
  box-sizing: border-box; 
  outline: none; 
  text-align: right;
}

.custom-select option { 
  background: #333; 
  color: white; 
}

.slider-container { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  background: rgba(0,0,0,0.3); 
  padding: 8px 10px; 
  border-radius: 10px; 
}

.slider-container span { 
  font-size: 12px; 
  white-space: nowrap; 
  color: #ccc; 
  min-width: 40px;
}

input[type=range] { 
  flex: 1; 
  accent-color: var(--app-color); 
}

.delete-btn { 
  background: rgba(255, 59, 48, 0.2); 
  color: #ff3b30; 
  border: 1px solid rgba(255, 59, 48, 0.5); 
  padding: 10px; 
  border-radius: 10px; 
  font-family: 'Tajawal'; 
  font-weight: bold; 
  cursor: pointer; 
  width: 100%; 
}

/* النوافذ والإشعارات */
.modal-overlay { 
  position: fixed; 
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 100%; 
  background: rgba(0,0,0,0.8); 
  display: none; 
  justify-content: center; 
  align-items: center; 
  z-index: 200; 
  backdrop-filter: blur(8px); 
}

.modal-content { 
  background: rgba(20,20,20,0.95); 
  backdrop-filter: blur(20px); 
  border: 1px solid rgba(255,255,255,0.2); 
  border-radius: 25px; 
  padding: 20px; 
  width: 90%; 
  max-width: 350px; 
  text-align: center; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
  transform: scale(0.8); 
  opacity: 0; 
  transition: 0.4s; 
  position: relative; 
  box-sizing: border-box; 
}

.modal-content.show-modal { 
  transform: scale(1); 
  opacity: 1; 
}

.close-modal { 
  position: absolute; 
  top: 15px; 
  right: 15px; 
  background: none; 
  border: none; 
  color: white; 
  font-size: 20px; 
  cursor: pointer; 
  z-index: 10; 
}

.submit-btn {
  background: var(--main-gold) !important;
  color: #000 !important;
  font-weight: bold;
}

#toast-container { 
  position: fixed; 
  bottom: 20px; 
  left: 50%; 
  transform: translateX(-50%); 
  z-index: 1000; 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
  width: 90%; 
  max-width: 300px;
}

.toast { 
  background: rgba(255,255,255,0.95); 
  color: black; 
  padding: 12px 20px; 
  border-radius: 20px; 
  font-family: 'Tajawal', sans-serif; 
  font-weight: bold; 
  font-size: 14px; 
  box-shadow: 0 5px 20px rgba(0,0,0,0.4); 
  opacity: 0; 
  transform: translateY(20px); 
  transition: all 0.4s ease; 
  text-align: center; 
}

.toast.show { 
  opacity: 1; 
  transform: translateY(0); 
}
/* =========================================================
   تنسيقات الكمبيوتر (شاشات التيك توك) 
   ========================================================= */
@media (min-width: 768px) {
  #todayTab {
    padding-top: 0 !important;
    height: 100vh;
  }


  .feed-container {
    width: calc(100% - 280px);
    margin-right: 280px;
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
  }

  /* نقل الأزرار لليسار وتوسيطها عشان القائمة الجانبية ما تغطي عليها */
  .feed-side-actions {
    right: 300px; /* القائمة 280 + مسافة 20 */
    bottom: 50%;
    transform: translateY(50%);
  }
  .post {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }

  /* ترتيب حجم الصورة عشان تطلع كاملة وما تنقص على الشاشة العريضة */
  .post-img {
    width: auto;
    height: 92vh;

    max-width: 420px;
    object-fit: cover;

    border-radius: 25px;

    box-shadow:
      0 0 40px rgba(0,0,0,0.5),
      0 0 80px rgba(214,197,174,0.08);
  }
  #mainApp {
    flex-direction: row; /* جعل العناصر بجانب بعضها */
    align-items: flex-start;
  }

  /* تحويل القائمة العلوية إلى قائمة جانبية على اليمين */
  .header-container {
    position: fixed;
    top: 0;
    right: 0;
    width: 280px;
    height: 100vh;
    background: #0a0a0a;
    border-left: 2px solid var(--main-gold-trans);
    padding: 30px 20px;
    z-index: 200;
  }

  background: linear-gradient(
    180deg,
    rgba(20,20,20,0.9),
    rgba(20,20,20,0.6)
  );

  backdrop-filter: blur(15px);
  border-left: 1px solid rgba(214, 197, 174, 0.2);

  padding: 20px;
  box-sizing: border-box;
  align-items: flex-start;
  justify-content: flex-start;
  z-index: 100;
}

  .desktop-logo {
    display: block !important; /* إظهار اللوجو */
  }

  .header {

<script>
// ================= المتغيرات الأساسية =================
const images = [
"images/1.jpg", "images/2.jpg", "images/3.jpg", "images/4.jpg",
"images/5.jpg", "images/6.jpg", "images/7.jpg", "images/8.jpg",
"images/9.jpg", "images/10.jpg", "images/11.jpg", "images/12.jpg",
"images/13.jpg", "images/14.jpg", "images/15.jpg", "images/16.jpg",
"images/17.jpg", "images/18.jpg", "images/19.jpg", "images/20.jpg",
"images/21.jpg", "images/22.jpg", "images/23.jpg", "images/24.jpg",
"images/25.jpg", "images/26.jpg", "images/27.jpg", "images/28.jpg",
"images/29.jpg", "images/30.jpg", "images/31.jpg", "images/32.jpg",
"images/33.jpg", "images/34.jpg", "images/35.jpg", "images/36.jpg",
"images/37.jpg", "images/38.jpg", "images/39.jpg", "images/40.jpg",
"images/41.jpg", "images/42.jpg", "images/43.jpg", "images/44.jpg"
];
const MAX_VIEWS = 3;
const API_KEY = "3863ddcd-c4bc-4099-9148-d4344f98bdd2"; 
let currentFavOpenIndex = null; 
let currentShareImgSrc = "";

// إشعار التوست
function showToast(message) {
  let container = document.getElementById("toast-container");
  
  if (!container) { 
    container = document.createElement("div"); 
    container.id = "toast-container"; 
    document.body.appendChild(container); 
  }
  
  const toast = document.createElement("div"); 
  toast.className = "toast"; 
  toast.innerText = message; 
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add("show");
  }, 10);
  
  setTimeout(() => { 
    toast.classList.remove("show"); 
    setTimeout(() => {
      toast.remove();
    }, 400); 
  }, 3000);
}

// ================= نظام التشغيل والشعلة =================
function initApp() {
  const today = new Date().toDateString();
  let savedDate = localStorage.getItem("appDate");
  
  if (!localStorage.getItem("unseenQuotes")) {
    generateShuffledQuotes();
  }
  
  if (savedDate !== today) {
    localStorage.setItem("appDate", today);
    localStorage.setItem("viewCount", "1");
    localStorage.setItem("currentQuoteIndex", getNextQuoteIndex().toString());
    updateStreak(today);
  } else { 
    displayStreak(); 
  }
}

function generateShuffledQuotes() {
  let all = Array.from({length: images.length}, (_, i) => i);
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  localStorage.setItem("unseenQuotes", JSON.stringify(all));
}

function getNextQuoteIndex() {
  let unseen = JSON.parse(localStorage.getItem("unseenQuotes")) || [];
  
  if (unseen.length === 0) {
    generateShuffledQuotes();
    unseen = JSON.parse(localStorage.getItem("unseenQuotes"));
  }
  
  let nextIndex = unseen.pop();
  localStorage.setItem("unseenQuotes", JSON.stringify(unseen));
  return nextIndex;
}

function updateStreak(todayStr) {
  let lastVisit = localStorage.getItem("lastVisitDate");
  let streak = parseInt(localStorage.getItem("streakCount") || "0");
  
  if (lastVisit) {
    let yesterday = new Date(); 
    yesterday.setDate(yesterday.getDate() - 1);
    
    if (lastVisit === yesterday.toDateString()) {
      streak++; 
    } else if (lastVisit !== todayStr) {
      streak = 1; 
    }
  } else {
    streak = 1; 
  }
  
  localStorage.setItem("lastVisitDate", todayStr);
  localStorage.setItem("streakCount", streak.toString());
  displayStreak();
}

function displayStreak() {
  let streak = parseInt(localStorage.getItem("streakCount") || "0");
  const badge = document.getElementById("streakBadge");
  
  if (streak > 0) { 
    badge.style.display = "flex"; 
    document.getElementById("streakCount").innerText = streak; 
  }
}

function showSplashScreen() {
  const overlay = document.getElementById("overlay");
  const splash = document.getElementById("splashScreen");
  
  overlay.style.opacity = "0";
  
  setTimeout(() => {
    overlay.style.display = "none"; 
    splash.style.display = "flex"; 
    initApp(); 
    setTimeout(() => {
      splash.style.opacity = "1";
    }, 50);
  }, 500);
  
  setTimeout(() => {
    splash.style.opacity = "0";
    setTimeout(() => {
      splash.style.display = "none"; 
      document.getElementById("mainApp").style.display = "flex";
      renderFeed(); 
      loadFavorites(); 
    }, 500);
  }, 2000);
}

// ================= نظام التيك توك (رسالة اليوم) =================
// سريع وسلس جداً
function renderFeed() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  images.forEach((src, index) => {
    const post = document.createElement("div");
    post.className = "post";

    post.innerHTML = `
      <div class="post-bg-blur" style="background-image: url('${src}')"></div>
      <img src="${src}" class="post-img">

      <div class="feed-side-actions">
        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="toggleFeedLike(this, ${index})">
            <i class="fas fa-heart"></i>
          </button>
          <span class="feed-action-label" id="feed-count-${index}">1.2K</span>
        </div>

        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="openComments(${index})">
            <i class="fas fa-comment"></i>
          </button>
          <span class="feed-action-label">32</span>
        </div>

        <div class="feed-action-wrapper">
          <button class="feed-action-btn" onclick="openShareMenu('${src}')">
            <i class="fas fa-paper-plane"></i>
          </button>
          <span class="feed-action-label">نشر</span>
        </div>
      </div>
    `;
    feed.appendChild(post);
  });
}

function setupDoubleTap() {
  const posts = document.querySelectorAll('.post');
  posts.forEach(post => {
    let lastClick = 0;
    post.addEventListener('click', function(e) {
      if(e.target.closest('.feed-side-actions')) return;
      
      let currentTime = new Date().getTime();
      let timeDiff = currentTime - lastClick;
      
      if (timeDiff < 300 && timeDiff > 0) {
        const heart = post.querySelector('.heart-animation');
        heart.classList.remove('show'); 
        void heart.offsetWidth; 
        heart.classList.add('show');
        setTimeout(() => heart.classList.remove('show'), 600);
        
        const likeBtn = post.querySelector('.feed-action-wrapper .feed-action-btn'); 
        if (!likeBtn.classList.contains('liked')) {
          likeBtn.click();
        }
      }
      lastClick = currentTime;
    });
  });
}

function toggleFeedLike(btn, imgIndex) {
  let likedImages = JSON.parse(localStorage.getItem("likedImages")) || {}; 
  let countSpan = document.getElementById(`feed-count-${imgIndex}`);
  let count = parseFloat(countSpan.innerText);
  
  if (!btn.classList.contains('liked')) {
    btn.classList.add('liked');
    btn.querySelector('.icon-outlined').style.opacity = '0';
    btn.querySelector('.icon-filled').style.opacity = '1';
    countSpan.innerText = (count + 0.1).toFixed(1) + 'K';
    likedImages[imgIndex] = true;
    showToast("تم الحفظ في المفضلة 🤍");
  } else {
    btn.classList.remove('liked');
    btn.querySelector('.icon-outlined').style.opacity = '1';
    btn.querySelector('.icon-filled').style.opacity = '0';
    countSpan.innerText = (count - 0.1).toFixed(1) + 'K';
    delete likedImages[imgIndex];
  }
  
  localStorage.setItem("likedImages", JSON.stringify(likedImages)); 
  loadFavorites(); 
}

function openShareMenu(src) { 
  currentShareImgSrc = src; 
  document.getElementById('shareSheetModal').style.display = "flex"; 
}

// ================= التنقل والنوافذ =================
function switchTab(tabId, btnId) {
  document.querySelectorAll('.tab-content').forEach(t => {
    t.classList.remove('active-tab');
  });
  
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.remove('active');
  });
  
  document.getElementById(tabId).classList.add('active-tab');
  document.getElementById(btnId).classList.add('active');
  
  if (tabId === 'favTab') {
    loadFavorites();
  }
}

function showModal(modalId, contentId) { 
  const modal = document.getElementById(modalId); 
  const content = document.getElementById(contentId); 
  modal.style.display = "flex"; 
  setTimeout(() => { 
    content.classList.add("show-modal"); 
  }, 50); 
}

function closeModal(modalId, contentId) { 
  const modal = document.getElementById(modalId); 
  const content = document.getElementById(contentId); 
  content.classList.remove("show-modal"); 
  setTimeout(() => { 
    modal.style.display = "none"; 
  }, 400); 
}

function closeModalSheet(modalId) { 
  document.getElementById(modalId).style.display = "none"; 
}

function downloadFromSrc(src) { 
  const link = document.createElement('a'); 
  link.href = src; 
  link.download = 'رسالة.jpg'; 
  document.body.appendChild(link); 
  link.click(); 
  document.body.removeChild(link); 
  showToast("بدأ التحميل 📥"); 
}

async function shareFromSrc(src) {
  try {
    const response = await fetch(src); 
    const blob = await response.blob(); 
    const file = new File([blob], 'رسالة.jpg', { type: blob.type });
    
    if (navigator.canShare && navigator.canShare({ files: [file] })) { 
      await navigator.share({ 
        title: 'رسالة اليوم', 
        text: 'حبيت أشاركك هالرسالة اللطيفة ✨', 
        files: [file] 
      }); 
    } else { 
      await navigator.share({ 
        title: 'رسالة اليوم', 
        text: 'شوف موقع رسالة اليوم ✨', 
        url: window.location.href 
      }); 
    }
  } catch (err) { 
    showToast("مشاركة غير مدعومة هنا 😢"); 
  }
}

// ================= نظام المفضلات الأصلي =================
function loadFavorites() {
  const grid = document.getElementById("favoritesGrid"); 
  grid.innerHTML = "";
  
  let likedImages = JSON.parse(localStorage.getItem("likedImages")) || {}; 
  let keys = Object.keys(likedImages);
  
  if (keys.length === 0) { 
    grid.innerHTML = "<div class='empty-state'>لا يوجد رسائل مفضلة حتى الآن 💔</div>"; 
    return; 
  }
  
  keys.forEach(indexStr => {
    let img = document.createElement("img"); 
    img.src = images[parseInt(indexStr)]; 
    img.className = "fav-item";
    img.onclick = () => {
      openFavoriteModal(indexStr);
    }; 
    grid.appendChild(img);
  });
}

function openFavoriteModal(indexStr) { 
  currentFavOpenIndex = indexStr; 
  document.getElementById("favViewImage").src = images[parseInt(indexStr)]; 
  showModal('favViewModal', 'favViewContent'); 
}

function removeFavoriteFromModal() {
  if (currentFavOpenIndex !== null) {
    let likedImages = JSON.parse(localStorage.getItem("likedImages")) || {}; 
    delete likedImages[currentFavOpenIndex];
    
    localStorage.setItem("likedImages", JSON.stringify(likedImages)); 
    showToast("تمت الإزالة من المفضلة 🗑️");
    
    closeModal('favViewModal', 'favViewContent'); 
    loadFavorites(); 
    renderFeed(); 
  }
}

async function sendQuoteToEmail() { 
  const userText = document.getElementById("userQuote").value; 
  
  if (userText.trim() === "") {
    return showToast("الرجاء كتابة الرسالة ✍️"); 
  }
  
  const btn = document.getElementById("submitQuoteBtn"); 
  btn.innerText = "جاري الإرسال ⏳..."; 
  btn.disabled = true; 
  
  try { 
    const response = await fetch("https://api.web3forms.com/submit", { 
      method: "POST", 
      headers: { "Content-Type": "application/json" }, 
      body: JSON.stringify({ 
        access_key: API_KEY, 
        subject: "اقتراح رسالة جديدة", 
        message: userText 
      }) 
    }); 
    
    const result = await response.json(); 
    
    if (result.success) { 
      showToast("تم الإرسال بنجاح! شكراً 🤍"); 
      closeModal('suggestModal', 'suggestContent'); 
      document.getElementById("userQuote").value = ""; 
    } 
  } catch (error) { 
    showToast("تأكد من اتصالك 🌐"); 
  } 
  
  btn.innerText = "إرسال الرسالة 🚀"; 
  btn.disabled = false; 
}

// ================= نظام "سوي رسالتك" المطور الأصلي (بدون حذف) =================
const captureArea = document.getElementById("captureArea");
const templateBg = document.getElementById("templateBg");
let elementCounter = 0;
let activeElement = null;
let initialDistance = null;
let initialScale = 1;
let initialX, initialY;
let bgPosX = 50; 
let bgPosY = 50; 

function changeCanvasSize() {
  const ratio = document.getElementById("canvasSizeSelector").value;
  captureArea.style.aspectRatio = ratio;
}

function changeBackground(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) { 
      templateBg.src = e.target.result; 
    }
    reader.readAsDataURL(file);
  }
}

function addOverlayImage(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      elementCounter++;
      const newImg = document.createElement("img");
      newImg.className = "draggable-item draggable-img";
      newImg.id = "dynElem_" + elementCounter;
      newImg.src = e.target.result;
      newImg.setAttribute("draggable", "false"); 
      
      newImg.dataset.scale = "1"; 
      newImg.dataset.rotation = "0"; 
      newImg.dataset.x = "0"; 
      newImg.dataset.y = "0";
      
      newImg.style.top = "50%"; 
      newImg.style.left = "50%"; 
      newImg.style.transform = `translate(-50%, -50%) scale(1) rotate(0deg)`;
      
      captureArea.appendChild(newImg);
      selectElement(newImg);
    }
    reader.readAsDataURL(file);
  }
}

function addNewText() {
  elementCounter++;
  const newText = document.createElement("div");
  newText.className = "draggable-item draggable-text";
  newText.id = "dynElem_" + elementCounter;
  newText.innerText = "اكتب هنا...";
  
  newText.dataset.scale = "1"; 
  newText.dataset.rotation = "0"; 
  newText.dataset.x = "0"; 
  newText.dataset.y = "0";
  
  newText.style.top = "50%"; 
  newText.style.left = "50%"; 
  newText.style.transform = `translate(-50%, -50%) scale(1) rotate(0deg)`;
  
  captureArea.appendChild(newText);
  selectElement(newText);
}

function selectElement(el) {
  if (activeElement && activeElement !== templateBg) {
    activeElement.classList.remove("selected");
  }
  
  activeElement = el;
  
  if(el !== templateBg) {
    el.classList.add("selected");
  }
  
  if (el === templateBg) {
    document.getElementById("toolsPanel").style.display = "none";
  } else {
    document.getElementById("toolsPanel").style.display = "flex";
    document.getElementById("activeElementScale").value = el.dataset.scale || 1;
    document.getElementById("activeElementRotation").value = el.dataset.rotation || 0;
    
    if (el.classList.contains("draggable-text")) {
      document.getElementById("textToolsRow").style.display = "flex"; 
      document.getElementById("activeTextInput").value = el.innerText;
    } else { 
      document.getElementById("textToolsRow").style.display = "none"; 
    }
  }
}

captureArea.addEventListener('click', (e) => {
  if (e.target.id === 'captureArea') {
    if (activeElement && activeElement !== templateBg) {
      activeElement.classList.remove("selected");
    }
    activeElement = null;
    document.getElementById("toolsPanel").style.display = "none";
  }
});

function updateActiveElementText() {
  if (!activeElement || !activeElement.classList.contains("draggable-text")) {
    return;
  }
  activeElement.innerText = document.getElementById("activeTextInput").value;
  activeElement.style.fontFamily = document.getElementById("activeFont").value;
  activeElement.style.color = document.getElementById("activeColor").value;
}

function updateActiveElementTransform() {
    if (!activeElement || activeElement === templateBg) {
      return;
    }
    
    let scale = parseFloat(document.getElementById("activeElementScale").value);
    let rotation = parseFloat(document.getElementById("activeElementRotation").value);
    
    activeElement.dataset.scale = scale; 
    activeElement.dataset.rotation = rotation;
    
    let cx = activeElement.dataset.x || 0; 
    let cy = activeElement.dataset.y || 0;
    
    activeElement.style.transform = `translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px)) scale(${scale}) rotate(${rotation}deg)`;
}

function deleteActiveElement() {
  if (activeElement && activeElement !== templateBg) { 
    activeElement.remove(); 
    activeElement = null; 
    document.getElementById("toolsPanel").style.display = "none"; 
  }
}

// السحب الشامل (للنصوص، الصور، وللخلفية)
captureArea.addEventListener("touchstart", dragStart, {passive: false});
captureArea.addEventListener("touchend", dragEnd, false);
captureArea.addEventListener("touchmove", drag, {passive: false});
captureArea.addEventListener("mousedown", dragStart, false);
captureArea.addEventListener("mouseup", dragEnd, false);
captureArea.addEventListener("mousemove", drag, false);
captureArea.addEventListener("mouseleave", dragEnd, false);

function dragStart(e) { 
  if (e.target.classList.contains('draggable-item') || e.target.id === 'templateBg') { 
    selectElement(e.target);
    
    if (e.touches && e.touches.length === 2 && e.target !== templateBg) {
      initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      initialScale = parseFloat(activeElement.dataset.scale) || 1;
    } else {
      let xOffset = 0;
      let yOffset = 0;
      
      if (e.target !== templateBg) {
        xOffset = parseFloat(activeElement.dataset.x) || 0;
        yOffset = parseFloat(activeElement.dataset.y) || 0;
      }
      
      initialX = (e.type.includes("touch") ? e.touches[0].clientX : e.clientX) - xOffset; 
      initialY = (e.type.includes("touch") ? e.touches[0].clientY : e.clientY) - yOffset; 
    }
  } 
}

function dragEnd(e) { 
  initialDistance = null; 
}

function drag(e) {
  if (activeElement && (e.type.includes("mouse") ? e.buttons === 1 : true)) {
    e.preventDefault();
    
    if (activeElement.id === 'templateBg') {
        let currentX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
        let currentY = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
        
        let dx = currentX - initialX; 
        let dy = currentY - initialY;
        
        let rect = captureArea.getBoundingClientRect();
        
        bgPosX -= (dx / rect.width) * 100;
        bgPosY -= (dy / rect.height) * 100;
        
        bgPosX = Math.max(0, Math.min(100, bgPosX));
        bgPosY = Math.max(0, Math.min(100, bgPosY));
        
        activeElement.style.objectPosition = `${bgPosX}% ${bgPosY}%`;
        
        initialX = currentX; 
        initialY = currentY;
    } else {
        let rot = activeElement.dataset.rotation || 0; 
        
        if (e.touches && e.touches.length === 2 && initialDistance) {
          let currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          let scale = initialScale * (currentDistance / initialDistance);
          
          activeElement.dataset.scale = scale; 
          document.getElementById("activeElementScale").value = scale;
          
          let cx = activeElement.dataset.x || 0; 
          let cy = activeElement.dataset.y || 0;
          
          activeElement.style.transform = `translate(calc(-50% + ${cx}px), calc(-50% + ${cy}px)) scale(${scale}) rotate(${rot}deg)`;
        } else if (!e.touches || e.touches.length === 1) {
          let currentX = (e.type.includes("touch") ? e.touches[0].clientX : e.clientX) - initialX; 
          let currentY = (e.type.includes("touch") ? e.touches[0].clientY : e.clientY) - initialY; 
          
          activeElement.dataset.x = currentX; 
          activeElement.dataset.y = currentY;
          
          let scale = activeElement.dataset.scale || 1;
          activeElement.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) scale(${scale}) rotate(${rot}deg)`;
        }
    }
  }
}

// ================= دوال التحميل والنشر المطورة =================
function exportCustomImage() {
  const btn = document.querySelector('.creator-card .action-btn:nth-child(1)');
  const originalText = btn.innerHTML;
  
  btn.innerHTML = "جاري التجهيز ⏳..."; 
  btn.disabled = true;
  
  if(activeElement && activeElement !== templateBg) {
    activeElement.classList.remove("selected");
  }

  html2canvas(captureArea, { scale: 3, useCORS: true }).then(canvas => {
    if(activeElement && activeElement !== templateBg) {
      activeElement.classList.add("selected");
    }
    
    const link = document.createElement('a'); 
    link.download = 'رسالتي_الخاصة.jpg'; 
    link.href = canvas.toDataURL('image/jpeg', 0.9);
    link.click(); 
    
    showToast("تم حفظ تصميمك بنجاح في المعرض! 🎉"); 
    btn.innerHTML = originalText; 
    btn.disabled = false;
  });
}

function publishCustomImage() {
  const btn = document.querySelector('.creator-card .action-btn:nth-child(2)');
  const originalText = btn.innerHTML;
  
  btn.innerHTML = "جاري النشر ⏳..."; 
  btn.disabled = true;
  
  if(activeElement && activeElement !== templateBg) {
    activeElement.classList.remove("selected");
  }
  
  // محاكاة عملية رفع الصورة والنشر على التطبيق
  setTimeout(() => {
    showToast("تم نشر رسالتك بنجاح! 🌟 ستظهر قريباً في قسم رسالة اليوم.");
    btn.innerHTML = originalText;
    btn.disabled = false;
  }, 1500);
}

window.addEventListener('DOMContentLoaded', addNewText);

let currentPost = null;

function openComments(index) {
  currentPost = index;
  showModal('commentsModal','commentsContent');
  loadComments();
}

function loadComments() {
  const list = document.getElementById("commentsList");
  list.innerHTML = "";

  let comments = JSON.parse(localStorage.getItem("comments_" + currentPost)) || [];

  if (comments.length === 0) {
    list.innerHTML = "<p style='color:#aaa'>لا يوجد تعليقات</p>";
    return;
  }

  comments.forEach((c, i) => {
    let div = document.createElement("div");
    div.className = "comment-item";

    div.innerHTML = `
      <img class="comment-avatar" src="https://i.pravatar.cc/150?img=${i+5}">
      
      <div class="comment-content">
        <div class="comment-name">مستخدم ${i+1}</div>
        <div class="comment-text">${c.text}</div>
      </div>

      <div class="comment-like ${c.liked ? 'liked' : ''}" onclick="toggleCommentLike(${i})">
        <i class="fas fa-heart"></i>
        <span>${c.likes || 0}</span>
      </div>
    `;

    list.appendChild(div);
  });
}

function addComment() {
  const input = document.getElementById("commentInput");
  let text = input.value.trim();

  if (!text) return;

  let key = "comments_" + currentPost;
  let comments = JSON.parse(localStorage.getItem(key)) || [];

  comments.unshift({
    text: text,
    likes: 0,
    liked: false
  });

  localStorage.setItem(key, JSON.stringify(comments));

  input.value = "";
  loadComments();
}

function toggleCommentLike(index) {
  let key = "comments_" + currentPost;
  let comments = JSON.parse(localStorage.getItem(key)) || [];

  let comment = comments[index];

  if (!comment.liked) {
    comment.likes++;
    comment.liked = true;
  } else {
    comment.likes--;
    comment.liked = false;
  }

  localStorage.setItem(key, JSON.stringify(comments));
  loadComments();
}
</script>

<div class="modal-overlay" id="commentsModal" onclick="if(event.target===this) closeModal('commentsModal','commentsContent')">
  <div class="modal-content" id="commentsContent">
    <button class="close-modal" onclick="closeModal('commentsModal','commentsContent')">✖</button>
    
    <h3>التعليقات 💬</h3>
     <div id="commentsList"></div>

<div class="comment-input-row">
  <input id="commentInput" class="custom-input" placeholder="اكتب تعليقك...">
  <button class="submit-btn" onclick="addComment()">إرسال</button>
</div>
</div>
